server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Custom 404 error page - redirect all not found pages to fellou.ai
    error_page 404 = @redirect_to_fellou;
    
    location @redirect_to_fellou {
        return 301 https://fellou.ai/;
    }

    # Default location for other requests
    location / {
        try_files $uri $uri/ =404;
    }
}